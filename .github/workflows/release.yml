name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os,tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert os.environ['RELEASE_TAG'] == f'v{version}',
          f'tag {os.environ[\"RELEASE_TAG\"]} does not match v{version}'"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/release-wheel
      - run: /tmp/release-wheel/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/release-wheel/bin/python -c "import fuzz_target_scout; assert fuzz_target_scout.__version__"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
