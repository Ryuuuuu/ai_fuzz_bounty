name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/fts-wheel
      - run: /tmp/fts-wheel/bin/python -m pip install dist/*.whl
      - run: cd /tmp && /tmp/fts-wheel/bin/fts --config /tmp/no-config.toml catalog
      - run: cd /tmp && /tmp/fts-wheel/bin/fuzz-pipeline --config /tmp/no-config.toml doctor
