[github]
# GITHUB_TOKEN 환경변수 사용을 권장합니다. 파일에 토큰을 넣지 마세요.
api_url = "https://api.github.com"
per_query = 20
max_tree_paths = 5000
timeout_seconds = 20
# 일시적인 연결 종료는 저장소 전체 탐색을 중단하지 않고 짧게 재시도합니다.
retry_attempts = 3
retry_backoff_seconds = 1
# 새 탐색도 검증 카탈로그를 먼저 확인한 뒤 일반 GitHub 검색으로 확장합니다.
seed_policy_catalog = true
# 각 반복에서 다음 검색 결과 페이지로 이동해 같은 저장소만 다시 보지 않습니다.
max_search_pages = 20
queries = [
  "archived:false fork:false pushed:>={pushed_after} stars:20..10000 language:C",
  "archived:false fork:false pushed:>={pushed_after} stars:20..10000 language:C++",
]
# 기존 config.toml을 유지해도 이 기본 확장 검색은 자동으로 추가됩니다.
additional_queries = [
  "\"bug bounty\" in:readme archived:false fork:false pushed:>={pushed_after} language:C",
  "\"bug bounty\" in:readme archived:false fork:false pushed:>={pushed_after} language:C++",
  "org:facebook archived:false fork:false pushed:>={pushed_after} language:C",
  "org:facebook archived:false fork:false pushed:>={pushed_after} language:C++",
  "org:facebookincubator archived:false fork:false pushed:>={pushed_after} language:C",
  "org:facebookincubator archived:false fork:false pushed:>={pushed_after} language:C++",
  "org:EpicGames archived:false fork:false pushed:>={pushed_after} language:C++",
]

[policy]
catalog_path = "catalog.json"
max_catalog_age_days = 45
allow_conditional_handoff = false
# Google OSS VRP는 2026-10-01부터 신규 product vulnerability 접수를 중단했습니다.
# https://github.com/google/bughunters/commit/f8bf23ad
# 현재는 목록 동기화를 기본적으로 끕니다. 이전 저장소 목록도 정책 검사에서 제외됩니다.
google_oss_vrp_feed_enabled = false
google_oss_vrp_feed_repository = "google/bughunters"
google_oss_vrp_feed_path = "oss-repository-tier/external_repositories.txtpb"
google_oss_vrp_feed_branch = "main"
google_oss_vrp_program_url = "https://bughunters.google.com/about/rules/open-source/google-open-source-software-vulnerability-reward-program-rules"

[architecture]
# 실행 호스트를 자동 감지하고 같은 아키텍처에서 검증된 대상만 선택합니다.
mode = "native_only"
host_arch = "auto"
require_explicit_support = true
# 루트 빌드와 퍼즈 하네스가 있으면 실제 ARM 검증 대기열에 올립니다. 파일 존재만으로 승인하지 않습니다.
allow_portable_native_probe = true
max_evidence_files = 8
# 중앙 에이전트만 미확인 C/C++ 후보를 격리 컨테이너에서 고정 SHA로 빌드·스모크합니다.
arm_preflight_enabled = true
arm_preflight_max_per_scan = 2
arm_preflight_timeout_seconds = 900
arm_preflight_max_repository_kb = 50000
arm_preflight_failure_retry_hours = 24
# Ubuntu 공식 이미지는 amd64와 arm64를 모두 제공하며 현재 호스트 변형을 받습니다.
native_builder_image = "ubuntu:24.04"

[scoring]
minimum_static_score = 35
minimum_handoff_score = 55

[ai]
enabled = true
provider = "codex_cli"
executable = "codex"
model = "gpt-6-astra"
reasoning_effort = "high"
max_candidates_per_scan = 5
minimum_static_score = 50
prompt_version = "candidate-assessment-v1"
timeout_seconds = 90
schema_path = "schemas/candidate-assessment.schema.json"

[storage]
database_path = "data/scout.sqlite3"
export_path = "data/verified-candidates.jsonl"

[pipeline]
input_path = "data/verified-candidates.jsonl"
runs_path = "data/runs"
tools_path = ".tools"
toolchain_lock_path = "toolchain.lock.json"
oss_fuzz_index_path = "oss-fuzz-support.json"
languages = ["C", "C++"]
ai_model = "gpt-6-astra"
ai_reasoning_effort = "high"
ai_executable = "codex"
coverage_schema_path = "schemas/coverage-review.schema.json"
quartet_schema_path = "schemas/quartet-review.schema.json"
triage_schema_path = "schemas/triage-report.schema.json"
validation_schema_path = "schemas/validation-agent.schema.json"
coverage_ai_timeout_seconds = 180
quartet_ai_timeout_seconds = 360
generation_ai_timeout_seconds = 240
generation_max_tokens = 4096
max_generation_cycles = 2
introspector_endpoint = "https://introspector.oss-fuzz.com/api"
introspector_timeout_seconds = 30
coverage_candidate_limit = 10
max_harness_attempts = 3
# 여러 하네스가 빌드되면 이 개수까지만 동적 검사와 AI 검토를 시도합니다.
max_fuzz_target_attempts = 3
setup_timeout_seconds = 5400
smoke_seconds = 300
fuzz_seconds = 86400
fuzz_checkpoint_seconds = 3600
triage_timeout_seconds = 3600
triage_reproduction_attempts = 3
triage_max_crashes = 20
triage_ubsan_enabled = true
coverage_stall_seconds = 14400
afl_cmplog_enabled = true
afl_cmplog_seconds = 3600
# 0이면 Linux affinity, cgroup v1/v2, /proc와 Docker 제한을 조합해 계산합니다.
max_parallel_jobs = 0
auto_parallel_job_cap = 4
parallel_workers = 0
max_workers_per_job = 6
min_workers_per_job = 2
resource_cpu_reserve = 1
resource_memory_reserve_mb = 1024
memory_per_fuzz_worker_mb = 768
container_memory_overhead_mb = 384
min_container_memory_mb = 1024
inspect_docker_resources = true
probe_seconds = 60
# 0이면 각 동시 작업에 필요한 메모리를 자동 계산합니다.
container_memory_mb = 0
fuzzer_rss_limit_mb = 1024
input_timeout_seconds = 10
job_disk_limit_mb = 20480
corpus_limit_mb = 4096
corpus_max_files = 100000
log_max_files = 200
runtime_retention_hours = 24
# 과거 job.json에 기록된 저장소는 커밋·경과 시간과 관계없이 신규 자동 선택에서 제외합니다.
# 같은 작업 ID의 미완료 작업은 중단 지점부터 재개합니다.
# 아래 쿨다운 값은 기존 대기열의 정리·진단에만 사용하며 영구 제외를 해제하지 않습니다.
repository_failure_threshold = 2
repository_failure_cooldown_hours = 168
repository_success_cooldown_hours = 720
# 낮은 도달률은 2시간 후, 신규 경로가 없는 정체는 6시간 후 다음 대상으로 전환합니다.
low_yield_rotation_enabled = true
low_yield_min_seconds = 7200
low_yield_min_coverage_edges = 750
low_yield_min_edge_growth = 16
low_yield_min_feature_growth = 64
low_yield_stagnation_seconds = 21600
max_stage_failures = 3
dashboard_interval_seconds = 10
# OSS-Fuzz 정의가 없는 C/C++ 프로젝트에 로컬 통합 생성을 허용합니다.
allow_generic_integrations = true
generic_integration_ai_timeout_seconds = 300
# VistaFuzz는 OpenCV-Python 계열 API 작업을 명시적으로 선택할 때만 켭니다.
vistafuzz_enabled = false
vistafuzz_seconds = 3600

[agent]
# 30분마다 구조화된 진행 로그와 AI 상태 판정을 남깁니다.
monitor_interval_seconds = 1800
stale_after_seconds = 5400
ai_timeout_seconds = 180
ai_failure_alert_threshold = 2
# 독립 점검은 오래된 대화 누적과 토큰 증가를 막습니다. 필요할 때만 true로 설정합니다.
persistent_health_session = false
health_session_rotation_checks = 24
state_path = "data/central-agent/state.json"
log_path = "data/central-agent/progress.jsonl"
notification_log_path = "data/central-agent/notifications.jsonl"
decisions_path = "data/central-agent/decisions"
session_state_path = "data/central-agent/codex-sessions.json"
capacity_schema_path = "schemas/central-capacity.schema.json"
health_schema_path = "schemas/central-health.schema.json"
cycle_schema_path = "schemas/central-cycle.schema.json"
# 실제 비밀값이 아니라 읽을 환경변수 이름만 설정합니다.
telegram_token_env = "FUZZ_TELEGRAM_BOT_TOKEN"
telegram_chat_id_env = "FUZZ_TELEGRAM_CHAT_ID"
telegram_timeout_seconds = 15
telegram_retry_attempts = 3
telegram_retry_backoff_seconds = 2
# AI 문구가 흔들려도 같은 등급의 상태 경고를 이 시간 동안 재전송하지 않습니다.
health_alert_cooldown_seconds = 7200
auto_discover = true
discovery_interval_seconds = 21600
# 실행 가능한 작업이 없을 때는 더 짧은 주기로 새 C/C++ 범위를 찾습니다.
idle_discovery_interval_seconds = 3600
# 작업이 비면 검색 쿼리마다 연속된 페이지를 더 살펴봅니다.
idle_search_pages_per_query = 2
idle_arm_preflight_max_attempts = 4
idle_arm_preflight_budget_seconds = 1800
# 과거 미시도 후보 최대 6개를 매 탐색마다 최신 GitHub/정책 정보로 재검증합니다.
revalidation_backlog_per_scan = 6
# 후보 갱신 자체가 실패하면 정상 주기를 기다리지 않고 이 시간 뒤 재시도합니다.
discovery_error_retry_seconds = 300
discovery_limit = 0
auto_improve = true
auto_recover_failures = true
max_automatic_recoveries_per_job = 2
max_improvement_cycles_per_job = 1
improvement_probe_seconds = 600
# 실행 중 정체 전략을 최소한 이 퍼징 시간만큼 평가한 뒤 다음 전략을 고릅니다.
adaptive_strategy_evaluation_seconds = 3600

[daemon]
interval_seconds = 21600
