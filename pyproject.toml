[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzz-target-scout"
version = "0.6.0"
description = "Find Linux-friendly open-source fuzzing candidates with verified bug-bounty policies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.urls]
Repository = "https://github.com/Ryuuuuu/ai_fuzz_bounty"
Issues = "https://github.com/Ryuuuuu/ai_fuzz_bounty/issues"

[project.scripts]
fuzz-target-scout = "fuzz_target_scout.cli:main"
fts = "fuzz_target_scout.cli:main"
fuzz-pipeline = "fuzz_target_scout.pipeline_cli:main"
oss-fuzz-gen-codex = "fuzz_target_scout.oss_fuzz_gen_codex:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzz_target_scout = ["resources/*.json", "resources/schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
