[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzz-target-scout"
version = "0.1.0"
description = "Find Linux-friendly open-source fuzzing candidates with verified bug-bounty policies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
fuzz-target-scout = "fuzz_target_scout.cli:main"
fts = "fuzz_target_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
